apiVersion: apps/v1
kind: Deployment 
metadata:
  name: {{ .Values.appname }}
  labels:
    app: {{ .Values.labels.app }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.labels.app }}
    spec:
      containers: 
      - name: flask-container 
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        # imagePullPolicy: Never 
        ports:
        - containerPort: 5000