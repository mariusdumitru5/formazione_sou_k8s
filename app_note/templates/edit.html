<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Nota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>body { background-color: #f4f6f9; }</style>
</head>
<body>

<div class="container py-5" style="max-width: 600px;">
    <div class="card shadow border-0 rounded-4">
        <div class="card-header bg-primary text-white border-0 rounded-top-4 py-3">
            <h4 class="mb-0"><i class="bi bi-pencil-square"></i> Modifica Nota</h4>
        </div>
        <div class="card-body p-4">
            <form action="/modifica/{{ nota.id }}" method="POST">
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold">Titolo</label>
                    <input type="text" class="form-control" name="titolo" value="{{ nota.titolo }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold">Data di Scadenza (Opzionale)</label>
                    <input type="date" class="form-control" name="data_scadenza" value="{{ nota.data_scadenza if nota.data_scadenza else '' }}">
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted fw-bold">Contenuto</label>
                    <textarea class="form-control" name="contenuto" rows="5" required>{{ nota.contenuto }}</textarea>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="/" class="btn btn-light border"><i class="bi bi-arrow-left"></i> Annulla</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Salva Modifiche</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
